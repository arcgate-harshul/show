
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Jetha Kitchen Equipments</title>
    <style>
        :root { --primary: #c2410c; --dark: #1f2937; --light: #f3f4f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); }
        header { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.5rem; color: var(--primary); }
        nav ul { list-style: none; display: flex; gap: 15px; }
        nav a { color: white; text-decoration: none; font-weight: 500; }
        nav a:hover, nav a.active { color: var(--primary); }
        .page-header { background: var(--primary); color: white; text-align: center; padding: 40px 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 40px 5%; }
        .gallery-grid img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .gallery-grid img:hover { transform: scale(1.03); }
        footer { background: var(--dark); color: white; text-align: center; padding: 20px; margin-top: 40px; }
        
        /* Lightbox CSS */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 5px; }
        #lightbox .close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
        
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 768px) {
            nav ul { display: none; flex-direction: column; background: var(--dark); position: absolute; top: 60px; right: 0; width: 100%; text-align: center; padding: 10px 0; }
            nav ul.show { display: flex; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Jetha Kitchen Equipments</h1>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-header">
        <h2>Photo Gallery</h2>
        <p>A glimpse into our manufacturing and product setups.</p>
    </div>

    <div class="gallery-grid">
        <img src="https://images.unsplash.com/photo-1590846406792-0adc7f938f1d?auto=format&fit=crop&w=600&q=80" onclick="openLightbox(this.src)" alt="Commercial Kitchen">
        <img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=600&q=80" onclick="openLightbox(this.src)" alt="Stainless Steel Racks">
        <img src="https://images.unsplash.com/photo-1583095126620-63ce73e86c0c?auto=format&fit=crop&w=600&q=80" onclick="openLightbox(this.src)" alt="Catering Burners">
        <img src="https://images.unsplash.com/photo-1627308595186-e10c16801216?auto=format&fit=crop&w=600&q=80" onclick="openLightbox(this.src)" alt="Industrial Fryer">
        <img src="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=600&q=80" onclick="openLightbox(this.src)" alt="Factory Machinery">
        <img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=600&q=80" onclick="openLightbox(this.src)" alt="Modular Kitchen Finish">
    </div>

    <div id="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="">
    </div>

    <footer>
        <p>&copy; 2026 Jetha Kitchen Equipments & Designings.</p>
    </footer>

    <script>
        function toggleMenu() { document.getElementById("nav-links").classList.toggle("show"); }
        function openLightbox(src) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("lightbox-img").src = src;
        }
        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>
</body>
</html>
